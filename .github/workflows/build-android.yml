name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        elif [ -f "./android/gradlew" ]; then
          chmod +x ./android/gradlew
        fi

    - name: Build Release APK
      # تصحیح مهم: دستور گریدل باید ./gradlew assembleRelease باشد (نه ./assembleRelease)
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleRelease
        elif [ -f "./android/gradlew" ]; then
          cd android && ./gradlew assembleRelease
        else
          echo "Error: gradlew file not found! Ensure Gradle wrapper is committed."
          exit 1
        fi

    - name: Sign APK (Optional / If not configured in build.gradle)
      # اگر امضا در فایل build.gradle تنظیم نشده باشد، می‌توانید مراحل امضا با apksigner را اینجا اضافه کنید.
      run: echo "Build completed successfully!"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: |
          app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/release/*.apk
